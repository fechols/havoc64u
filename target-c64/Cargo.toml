[package]
name = "havoc-c64"
version = "0.1.2"
edition = "2021"
license = "MIT"
build = "build.rs"

[workspace]

[features]
default = []
benchmarks = []
span-buffer = ["havoc/span-buffer"]
span-front-to-back = ["span-buffer", "havoc/span-front-to-back"]

[dependencies]
havoc = { path = "..", default-features = false }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 2
panic = "abort"
overflow-checks = false
debug = true
strip = false
