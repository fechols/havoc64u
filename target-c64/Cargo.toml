[package]
name = "havoc-c64"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[workspace]

[features]
benchmarks = []
four-sid = ["havoc/four-sid"]

[dependencies]
havoc = { path = "..", default-features = false }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false
debug = true
strip = false
