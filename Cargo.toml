[package]
name = "havoc"
version = "0.1.3"
edition = "2021"
license = "MIT"

[lib]
name = "havoc"
path = "src/lib.rs"

[[bin]]
name = "havoc"
path = "src/main.rs"
required-features = ["host-tools"]

[workspace]
exclude = ["target-c64"]

[dependencies]

[features]
default = ["host-tools"]
host-tools = []
span-buffer = []
span-front-to-back = ["span-buffer"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_arch, values("mos"))'] }

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"
